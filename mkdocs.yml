site_name: Scan2Study
site_url: https://11-ERICA.github.io/demo-repository/

theme:
  name: material

nav:
  - Home: index.md
  - Proposal: proposal.md
  - Team Rules: team-rules.md
  - API: api.md

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: google

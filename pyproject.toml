[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hilite"
version = "0.1.0"
description = "Tools for enhancing document images and detecting highlights"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Team 11" }]
dependencies = ["Pillow>=10"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://github.com/11-ERICA/team11-project"
Documentation = "https://11-erica.github.io/team11-project/"

[tool.hatch.build.targets.wheel]
packages = ["src/hilite"]
